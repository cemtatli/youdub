<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    @font-face { font-family: "Geist"; src: url("fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; }
    :root {
      color-scheme: light dark;
      --accent: #ef1b37;
      --bg: #f4f4f5;
      --card: #ffffff;
      --text: #18181b;
      --muted: #71717a;
      --line: #e4e4e7;
      --tile: #f4f4f5;
      --seg: #f4f4f5;
      --seg-on: #ffffff;
      --shadow: 0 1px 2px rgb(0 0 0 / 0.06), 0 0 0 1px rgb(0 0 0 / 0.04);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111113;
        --card: #1c1c1f;
        --text: #f4f4f5;
        --muted: #a1a1aa;
        --line: #2a2a2e;
        --tile: #2a2a2e;
        --seg: #111113;
        --seg-on: #333338;
        --shadow: 0 0 0 1px rgb(255 255 255 / 0.05);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 312px;
      padding: 14px 12px 12px;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.35 "Geist", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    header { display: flex; align-items: center; gap: 10px; padding: 0 4px 12px; }
    header img { width: 52px; height: 52px; object-fit: contain; flex: none; }
    header h1 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: -0.01em; }
    header p { margin: 1px 0 0; color: var(--muted); font-size: 12px; }

    .label {
      margin: 12px 8px 6px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .card { background: var(--card); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
    .row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; min-height: 48px; }
    .item + .item { border-top: 1px solid var(--line); }
    .tile {
      display: grid; place-items: center; flex: none;
      width: 28px; height: 28px; border-radius: 8px;
      background: var(--tile); color: var(--text);
    }
    .tile svg { width: 16px; height: 16px; }
    .text { flex: 1; min-width: 0; }
    .name { font-weight: 550; }
    .hint { color: var(--muted); font-size: 12px; margin-top: 1px; }

    /* sub-options slide open under their row while the feature is on */
    .sub { display: grid; grid-template-rows: 0fr; }
    .ready .sub { transition: grid-template-rows 0.2s ease; }
    .sub > div { overflow: hidden; }
    .sub.open { grid-template-rows: 1fr; }
    .sub .seg { margin: 0 12px 12px 50px; }

    .seg {
      display: flex; gap: 2px; padding: 2px;
      background: var(--seg); border-radius: 8px;
    }
    .seg button {
      flex: 1; border: 0; border-radius: 6px; padding: 5px 0;
      background: transparent; color: var(--muted);
      font: inherit; font-size: 12px; font-weight: 500; cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .seg button:hover { color: var(--text); }
    .seg button[aria-pressed="true"] { background: var(--seg-on); color: var(--text); box-shadow: 0 1px 2px rgb(0 0 0 / 0.12); }
    .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .seg.wide { margin: 0 12px 12px 50px; }

    .switch { position: relative; flex: none; width: 36px; height: 22px; }
    .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
    .switch span { position: absolute; inset: 0; border-radius: 22px; background: var(--line); pointer-events: none; }
    .switch span::before {
      content: ""; position: absolute; left: 2px; top: 2px; width: 18px; height: 18px;
      border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / 0.25);
    }
    .ready .switch span, .ready .switch span::before { transition: background 0.18s, transform 0.18s cubic-bezier(0.3, 0.7, 0.4, 1); }
    .switch input:checked + span { background: var(--accent); }
    .switch input:checked + span::before { transform: translateX(14px); }
    .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
    .item.off { opacity: 0.45; }
    .item.off .switch input { cursor: default; }

    footer { margin: 12px 8px 0; color: var(--muted); font-size: 11px; display: flex; justify-content: space-between; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before { transition: none !important; }
    }
  </style>
</head>
<body>
  <header>
    <img src="icons/mascot-small.png" alt="" />
    <div>
      <h1>Knobs</h1>
      <p data-i18n="tagline"></p>
    </div>
  </header>

  <div class="label" data-i18n="sectionFeed"></div>
  <div class="card">
    <div class="item">
      <div class="row">
        <div class="tile" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m3 16 5-5 4 4 3-3 6 6"/><circle cx="16" cy="9" r="1.5"/></svg>
        </div>
        <div class="text">
          <div class="name" data-i18n="thumbsName"></div>
          <div class="hint" data-i18n="thumbsHint"></div>
        </div>
        <label class="switch"><input type="checkbox" id="thumbs-enabled" data-i18n-label="thumbsName" /><span></span></label>
      </div>
      <div class="sub" id="thumbs-sub">
        <div>
          <div class="seg" id="thumbs-frame" role="group" data-i18n-label="frameGroup">
            <button data-value="1" data-i18n="frameStart"></button>
            <button data-value="2" data-i18n="frameMiddle"></button>
            <button data-value="3" data-i18n="frameEnd"></button>
          </div>
        </div>
      </div>
    </div>

    <div class="item">
      <div class="row">
        <div class="tile" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="3"/><path d="m4 4 16 16"/></svg>
        </div>
        <div class="text">
          <div class="name" data-i18n="shortsName"></div>
          <div class="hint" data-i18n="shortsHint"></div>
        </div>
        <label class="switch"><input type="checkbox" id="shorts-hidden" data-i18n-label="shortsName" /><span></span></label>
      </div>
    </div>

    <div class="item">
      <div class="row">
        <div class="tile" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><path d="m9 12 2 2 4-4"/></svg>
        </div>
        <div class="text">
          <div class="name" data-i18n="watchedName"></div>
          <div class="hint" data-i18n="watchedHint"></div>
        </div>
      </div>
      <div class="seg wide" id="watched-mode" role="group" data-i18n-label="watchedName">
        <button data-value="off" data-i18n="watchedOff"></button>
        <button data-value="dim" data-i18n="watchedDim"></button>
        <button data-value="hide" data-i18n="watchedHide"></button>
      </div>
    </div>
  </div>

  <div class="label" data-i18n="sectionWatch"></div>
  <div class="card">
    <div class="item" id="minimal-item">
      <div class="row">
        <div class="tile" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9.5 4.5 2.5-4.5 2.5z" fill="currentColor"/></svg>
        </div>
        <div class="text">
          <div class="name" data-i18n="minimalName"></div>
          <div class="hint" id="minimal-hint" data-i18n="minimalHint"></div>
        </div>
        <label class="switch"><input type="checkbox" id="minimal" data-i18n-label="minimalName" /><span></span></label>
      </div>
    </div>
  </div>

  <footer>
    <span data-i18n="footerLocal"></span>
    <span id="version"></span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
